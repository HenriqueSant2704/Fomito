<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Fomito · Garçom</title>
  <link rel="stylesheet" href="../compartilhado/css/tokens.css">
  <link rel="stylesheet" href="../compartilhado/css/base.css">
  <link rel="stylesheet" href="garcom.css">
</head>
<body>

  <header class="barra">
    <div class="linha" style="gap:16px">
      <div id="logo"></div>
      <span class="barra__divisor"></span>
      <span class="suave">Comandas</span>
    </div>
    <div class="garcom-perfil">
      <div class="pilha" style="text-align:right">
        <span class="forte" id="nomeGarcom">Carlos Mendes</span>
        <span class="pequeno suave" id="perfilGarcom">Garçom</span>
      </div>
      <div class="avatar" id="avatarGarcom">CM</div>
      <a class="btn-icone" id="voltarPainel" href="../painel/index.html" aria-label="Voltar ao painel" title="Voltar ao painel" hidden><i data-icone="inicio"></i></a>
      <button class="btn-icone" id="btnSair" aria-label="Sair" title="Sair"><i data-icone="sair"></i></button>
    </div>
  </header>

  <div class="layout">

    <!-- ============ LISTA DE MESAS ============ -->
    <section class="mesas">
      <div class="mesas__topo">
        <div>
          <h1>Mesas</h1>
          <p class="suave" id="resumoMesas"></p>
        </div>
        <nav class="filtros" id="filtros"></nav>
      </div>
      <div id="avisoNotificacao"></div>
      <div id="paraServir"></div>
      <div id="minhaBolsa"></div>
      <div class="grade" id="grade"></div>
    </section>

    <!-- ============ COMANDA DA MESA SELECIONADA ============ -->
    <aside class="comanda" id="comanda">
      <div class="comanda__vazia">
        <span class="vazio__icone"><i data-icone="mesa" class="ic--lg"></i></span>
        <h3>Nenhuma mesa selecionada</h3>
        <p class="suave pequeno">Selecione uma mesa para abrir a comanda,<br>lançar itens ou fechar a conta.</p>
      </div>
    </aside>

  </div>

  <script src="../compartilhado/js/api.js"></script>
  <script>
    Fomito.iniciar([
      "../compartilhado/js/icones.js",
      "../compartilhado/js/config.js",
      "../compartilhado/js/ilustracoes.js",
      "../compartilhado/js/sessao.js",
      "../compartilhado/js/dados.js",
      "../compartilhado/js/utils.js",
      "../compartilhado/js/selecao.js",
      "../compartilhado/js/alertas.js",
      "../compartilhado/js/contas-caixa.js",
      "../compartilhado/js/caixa.js",
      "../compartilhado/js/comandas.js",
      "garcom.js",
    ]);
  </script>
</body>
</html>
